<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign In — Netflix Clone</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page">
<header class="auth-header"><a class="logo" href="index.html">NETFLIX</a></header>
<main class="auth-main">
<form class="auth-card" id="loginForm" novalidate>
<h1>Sign In</h1>
<label for="loginEmail">Email or mobile number</label>
<input id="loginEmail" type="email" autocomplete="email"><small class="error" id="loginEmailError"></small>
<label for="loginPassword">Password</label>
<div class="password-wrap"><input id="loginPassword" type="password" autocomplete="current-password"><button type="button" class="password-toggle" data-target="loginPassword">Show</button></div>
<small class="error" id="loginPasswordError"></small>
<button class="btn auth-submit" type="submit">Sign In</button>
<div class="or"><span>OR</span></div>
<button class="code-button" type="button" id="demoCode">Use a Sign-In Code</button>
<a class="forgot" href="#">Forgot password?</a>
<label class="remember"><input type="checkbox"> Remember me</label>
<p class="auth-bottom">New to Netflix? <a href="signup.html">Sign up now.</a></p>
</form>
</main>
<footer class="auth-footer">This is a frontend recreation for educational purposes.</footer>
<script src="script.js"></script>
</body>
</html>
